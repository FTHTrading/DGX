[workspace]
members = [
    "crates/dgx-quantum",
    "crates/dgx-core",
    "crates/dgx-consensus",
    "crates/dgx-exchange",
    "crates/dgx-mining-forge",
    "crates/dgx-node"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.38", features = ["full"] }
