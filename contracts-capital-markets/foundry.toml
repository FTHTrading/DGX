# Locked configuration per Senior Loop Engineer directive.
# Reproducible bytecode is a hard audit requirement.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Solidity + EVM lock-in
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false            # keep off; deterministic bytecode + faster CI

# Testing
verbosity = 2
fuzz = { runs = 512 }     # per directive: 256-512 minimum
gas_reports = ["*"]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
